[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbom-scan"
version = "0.1.0"
description = "Cryptography inventory (CycloneDX CBOM) and post-quantum readiness for code, configs, certificates and TLS"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shubham Saurabh" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
keywords = ["cbom", "cyclonedx", "post-quantum", "pqc", "cryptography", "ml-kem", "security", "sarif"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security :: Cryptography", "License :: Other/Proprietary License"]

[project.urls]
Homepage = "https://github.com/shubSaurabh/cbom-scan"

[project.scripts]
cbom-scan = "cbom_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
